<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>物理エンジン検算 - test.html</title>
  <style>
    body { background: #000008; color: #ccc; font-family: monospace; padding: 16px; }
    .pass { color: #6fdc6f; }
    .fail { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>物理エンジン検算（design.md 11章 / decisions.md C-4）</h1>
  <div id="results">計算中...</div>

  <script type="module">
    import { createBodies, G } from './data.js';
    import { step, dt, defaultLaw, totalEnergy as physicsTotalEnergy } from './physics.js';

    const results = [];

    function assertClose(name, actual, expected, tolerance, unit = '') {
      const diff = Math.abs(actual - expected);
      const pass = diff <= tolerance;
      results.push({
        name,
        pass,
        detail: `実測値=${actual.toFixed(6)}${unit} 期待値=${expected}${unit} 誤差=${diff.toFixed(6)}${unit}（許容${tolerance}${unit}）`
      });
    }

    // テスト1: 周期 — 地球が1年でちょうど1周するか（design.md 5-3, 11章テスト1）
    function test1Period() {
      const bodies = createBodies();
      const law = { ...defaultLaw };
      const earth = bodies.find(b => b.name === '地球');
      let prevAngle = Math.atan2(earth.y, earth.x);
      let unwrapped = 0;
      let t = 0;
      const maxYears = 2; // 1周しないままここまで来たら異常とみなす安全装置

      while (t < maxYears) {
        step(bodies, law);
        t += dt;
        const angle = Math.atan2(earth.y, earth.x);
        let delta = angle - prevAngle;
        if (delta > Math.PI) delta -= 2 * Math.PI;
        if (delta < -Math.PI) delta += 2 * Math.PI;
        unwrapped += delta;
        prevAngle = angle;
        if (Math.abs(unwrapped) >= 2 * Math.PI) break;
      }
      assertClose('テスト1: 地球の公転周期', t, 1.00, 0.01, '年');
    }

    // 全天体の力学的エネルギー（運動+ポテンシャル）。指数2固定の現在の重力式に対応する式（B-4参照）。
    function totalEnergy(bodies) {
      let ke = 0, pe = 0;
      for (const b of bodies) {
        ke += 0.5 * b.m * (b.vx * b.vx + b.vy * b.vy);
      }
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const dx = bodies[j].x - bodies[i].x;
          const dy = bodies[j].y - bodies[i].y;
          const r = Math.sqrt(dx * dx + dy * dy) + 1e-9;
          pe += -G * bodies[i].m * bodies[j].m / r;
        }
      }
      return ke + pe;
    }

    // テスト2: エネルギー保存 — 100年回して変化率0.001%以下か（11章テスト2）
    function test2EnergyConservation() {
      const bodies = createBodies();
      const law = { ...defaultLaw };
      const e0 = totalEnergy(bodies);
      const steps = Math.round(100 / dt);
      for (let k = 0; k < steps; k++) step(bodies, law);
      const e1 = totalEnergy(bodies);
      const relChangePercent = Math.abs((e1 - e0) / e0) * 100;
      assertClose('テスト2: 100年後のエネルギー変化率', relChangePercent, 0, 0.001, '%');
    }

    // テスト3: 時間反転 — 100年進めて全速度を反転し、また100年進めると元の配置に戻るか（11章テスト3）
    // dtの符号を変える代わりに速度反転を使う（同じ意味：反転後に前進させると時間を逆行させたのと等価）。
    function test3TimeReversal() {
      const bodies = createBodies();
      const law = { ...defaultLaw };
      const initial = bodies.map(b => ({ x: b.x, y: b.y }));
      const steps = Math.round(100 / dt);

      for (let k = 0; k < steps; k++) step(bodies, law);
      for (const b of bodies) { b.vx *= -1; b.vy *= -1; }
      for (let k = 0; k < steps; k++) step(bodies, law);

      let maxError = 0;
      bodies.forEach((b, i) => {
        const dx = b.x - initial[i].x;
        const dy = b.y - initial[i].y;
        maxError = Math.max(maxError, Math.sqrt(dx * dx + dy * dy));
      });
      assertClose('テスト3: 時間反転後の位置誤差（全天体中の最大）', maxError, 0, 1e-4, ' AU');
    }

    // テスト4: 相対論 — gr=1で水星を100年回し、近日点が42.98秒角ずれるか（11章テスト4 / decisions.md B-6）
    // 他の惑星の摂動（100年で約530秒角）が混ざらないよう、太陽と水星だけで回す。
    // また時間刻みの粗さによる見かけの近日点移動（gr=0でも数千秒角ある）を打ち消すため、
    // gr=1 と gr=0 の差を相対論の効果とみなす。
    function test4GrPerihelion() {
      // 近日点の向き = 離心率ベクトル e = (v×h)/GM - r/|r| の角度。
      // 「最接近の瞬間」を探すより、毎ステップの位置と速度から直接求めるほうが時間刻みに左右されない。
      function perihelionAngle(b) {
        const r = Math.sqrt(b.x * b.x + b.y * b.y);
        const h = b.x * b.vy - b.y * b.vx; // 比角運動量
        const ex = b.vy * h / G - b.x / r;
        const ey = -b.vx * h / G - b.y / r;
        return Math.atan2(ey, ex);
      }
      function shiftAfter100Years(gr) {
        const bodies = createBodies().filter(b => b.name === '太陽' || b.name === '水星');
        const law = { ...defaultLaw, gr };
        const mercury = bodies[1];
        const start = perihelionAngle(mercury);
        const steps = Math.round(100 / dt);
        for (let k = 0; k < steps; k++) step(bodies, law);
        const d = perihelionAngle(mercury) - start;
        return Math.atan2(Math.sin(d), Math.cos(d)); // -π〜πに正規化
      }
      const toArcsec = rad => rad * 180 / Math.PI * 3600;
      const shift = toArcsec(shiftAfter100Years(1) - shiftAfter100Years(0));
      assertClose('テスト4: 水星の近日点移動（100年、gr=1とgr=0の差）', shift, 42.98, 1, '秒角');
    }

    // 追加テスト(Day4): law.dtSign=-1にした場合の時間反転（decisions.md A-4の実装そのものの検算）
    // テスト3は速度反転で代用していたが、こちらはDay4で実際にUIから触れるdtSignの経路を通す。
    function test4DtSignReversal() {
      const bodies = createBodies();
      const law = { ...defaultLaw };
      const initial = bodies.map(b => ({ x: b.x, y: b.y }));
      const steps = Math.round(50 / dt);

      for (let k = 0; k < steps; k++) step(bodies, law);
      law.dtSign = -1;
      for (let k = 0; k < steps; k++) step(bodies, law);

      let maxError = 0;
      bodies.forEach((b, i) => {
        const dx = b.x - initial[i].x;
        const dy = b.y - initial[i].y;
        maxError = Math.max(maxError, Math.sqrt(dx * dx + dy * dy));
      });
      assertClose('追加テスト(Day4): dtSign=-1での時間反転位置誤差（全天体中の最大）', maxError, 0, 1e-4, ' AU');
    }

    // 追加テスト(Day6): physics.jsのtotalEnergy（エネルギーグラフの元データ）の検算
    function test6Energy() {
      // (a) 既定の法則では100年でほぼ保存する（テスト2と同じ条件をphysics.js側の関数で）
      {
        const bodies = createBodies();
        const law = { ...defaultLaw };
        const e0 = physicsTotalEnergy(bodies, law);
        for (let k = 0; k < Math.round(100 / dt); k++) step(bodies, law);
        const rel = Math.abs((physicsTotalEnergy(bodies, law) - e0) / e0) * 100;
        assertClose('追加テスト(Day6): totalEnergyの100年保存（既定の法則）', rel, 0, 0.001, '%');
      }
      // (b) 太陽質量を1.5にしたまま回しても保存する（sunMassをポテンシャルに入れている検算）。
      // 0.5だと地球の初速が脱出速度とほぼ等しく全エネルギーが≒0になり、変化率の分母が小さすぎて検算にならない
      {
        const bodies = createBodies();
        const law = { ...defaultLaw, sunMass: 1.5 };
        const e0 = physicsTotalEnergy(bodies, law);
        for (let k = 0; k < Math.round(10 / dt); k++) step(bodies, law);
        const rel = Math.abs((physicsTotalEnergy(bodies, law) - e0) / e0) * 100;
        assertClose('追加テスト(Day6): 太陽質量1.5で10年回したときのエネルギー変化率', rel, 0, 0.001, '%');
      }
      // (c) 重力波をかけるとエネルギーが減る（グラフが下に折れることの検算）
      {
        const bodies = createBodies();
        const law = { ...defaultLaw, gw: 0.5 };
        const e0 = physicsTotalEnergy(bodies, law);
        for (let k = 0; k < Math.round(1 / dt); k++) step(bodies, law);
        const decreased = physicsTotalEnergy(bodies, law) < e0 ? 1 : 0;
        assertClose('追加テスト(Day6): 重力波gw=0.5で1年後にエネルギーが減る（1=減った）', decreased, 1, 0);
      }
      // (d) dimension ≠ 3 では定義されない（decisions.md B-4）
      {
        const undefinedEnergy = physicsTotalEnergy(createBodies(), { ...defaultLaw, dimension: 3.4 }) === null ? 1 : 0;
        assertClose('追加テスト(Day6): dimension=3.4でtotalEnergyがnull（1=null）', undefinedEnergy, 1, 0);
      }
    }

    test1Period();
    test2EnergyConservation();
    test3TimeReversal();
    test4GrPerihelion();
    test4DtSignReversal();
    test6Energy();

    const container = document.getElementById('results');
    container.innerHTML = '';
    for (const r of results) {
      const line = document.createElement('div');
      line.className = r.pass ? 'pass' : 'fail';
      line.textContent = `[${r.pass ? 'PASS' : 'FAIL'}] ${r.name} — ${r.detail}`;
      container.appendChild(line);
    }
  </script>
</body>
</html>
