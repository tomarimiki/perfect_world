<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>内惑星「法則破壊」シミュレータ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    経過年数: <span id="year">0.00</span> 年<br>
    全エネルギー: <span id="energy">—</span>
  </div>
  <button id="reset">リセット</button>
  <!-- Day7で追加：一時停止（decisions.md A-5。スペースキーでも切り替わる） -->
  <button id="pause">一時停止</button>
  <canvas id="canvas" width="600" height="600"></canvas>
  <!-- Day6で追加：エネルギーグラフ。メインcanvasの残像処理と干渉しないよう別canvasにする（decisions.md A-7） -->
  <canvas id="energy-graph" width="600" height="140"></canvas>
  <!-- ↓ ここから新規追加：Day3で導入したコントロールパネル -->
  <div id="panel">
    <!-- Day7で追加：プリセットボタン（design.md 9-3）。ボタンはmain.jsのPRESETSから生成する -->
    <div class="control">
      <label>プリセット</label>
      <div id="presets"></div>
    </div>

    <div class="control">
      <!-- スライダーの現在値をリアルタイムで表示する場所。
           main.jsのdimSlider.addEventListener('input', ...)が
           ここのtextContentを毎回書き換える -->
      <label>空間の次元 <span id="dim-val">3.00</span></label>

      <!-- id="dim" が main.js の document.getElementById('dim') で拾われる。
           min/max/step は design.md 7章の法則テーブルの値をそのまま使用
           （2.5〜4.0の範囲、0.01刻み） -->
      <input type="range" id="dim" min="2.5" max="4.0" step="0.01" value="3.0">

      <!-- スライダーの物理的背景を1行で説明（decisions.md A-11：説明文は最小限でよい） -->
      <p class="note">3を超えると安定な軌道が存在しなくなる</p>
    </div>

    <!-- ↓ Day4で追加：G・太陽質量・時間の流れ。decisions.md A-9により同じ#panel内に置く -->
    <div class="control">
      <label>重力の強さ G <span id="g-val">39.478</span></label>
      <!-- min/max/defaultはdesign.md 7章の法則テーブルの値 -->
      <input type="range" id="g" min="10" max="80" step="0.1" value="39.478">
      <p class="note">上げれば収縮、下げれば散逸</p>
    </div>

    <div class="control">
      <label>太陽質量 <span id="sun-mass-val">1.00</span></label>
      <input type="range" id="sun-mass" min="0.1" max="3.0" step="0.01" value="1.0">
      <p class="note">減らすと全軌道が一斉に膨張</p>
    </div>

    <div class="control">
      <!-- decisions.md A-4の決定：実体はSTEPS_PER_FRAME(速さ)。負の値で時間が逆行する -->
      <label>時間の流れ <span id="time-val">20</span></label>
      <input type="range" id="time" min="-100" max="100" step="1" value="20">
      <p class="note">負にすると時間が逆行する</p>
    </div>
    <!-- ↑ Day4ここまで -->

    <!-- ↓ Day5で追加：相対論と重力波。decisions.md A-9により同じ#panel内に置く -->
    <div class="control">
      <!-- min/max/defaultはdesign.md 7章の法則テーブルの値。gr=1が現実相当（100年で43秒角） -->
      <label>相対論 <span id="gr-val">0</span></label>
      <input type="range" id="gr" min="0" max="100000" step="100" value="0">
      <p class="note">近日点がずれ続け、花びら状のロゼッタ軌道になる</p>
    </div>

    <div class="control">
      <label>重力波 <span id="gw-val">0.00</span></label>
      <input type="range" id="gw" min="0" max="2" step="0.01" value="0">
      <p class="note">螺旋を描きながら太陽へ落下する</p>
    </div>
    <!-- ↑ Day5ここまで -->
  </div>
  <!-- ↑ ここまで新規追加 -->
  <script type="module" src="main.js"></script>
</body>
</html>
